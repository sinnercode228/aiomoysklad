name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: mypy --strict src
      - name: mypy (tests and examples)
        run: mypy

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        deps: [latest]
        include:
          # The oldest pydantic-core has no wheels for newer Pythons, so the lowest
          # versions are checked on the oldest supported Python only.
          - python-version: "3.10"
            deps: lowest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the latest versions
        if: matrix.deps == 'latest'
        run: python -m pip install -e ".[dev]"
      - name: Install the lowest versions allowed by pyproject
        if: matrix.deps == 'lowest'
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
