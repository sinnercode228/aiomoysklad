[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiomoysklad"
version = "0.1.0"
description = "Async toolkit for MoySklad JSON API 1.2 integrations: weighted rate limiting, retries, pagination, filters, stock, orders and webhooks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sinnercode228" }]
keywords = ["moysklad", "мойсклад", "api", "asyncio", "httpx", "rate-limit", "webhooks", "inventory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1", "pydantic>=2.5,<3"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/sinnercode228/aiomoysklad"
Source = "https://github.com/sinnercode228/aiomoysklad"
Issues = "https://github.com/sinnercode228/aiomoysklad/issues"
Changelog = "https://github.com/sinnercode228/aiomoysklad/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aiomoysklad"]

[tool.hatch.build.targets.sdist]
include = [
  "src/aiomoysklad",
  "tests",
  "examples",
  "docs",
  "CHANGELOG.md",
  "README.md",
  "README.ru.md",
  "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["aiomoysklad"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "PT", "RET", "C4", "PL",
  "D", "ANN", "TID", "T20", "LOG", "G", "DTZ", "PIE", "PERF", "FBT",
]
# ANN401: JSON bodies and payloads are typed as Any on purpose.
# RUF001-RUF003: MoySklad data, error texts and docs are in Russian, Cyrillic letters are intended.
ignore = [
  "D203", "D213", "D105", "D107", "PLR0913", "FBT001", "ANN401", "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "PLC0415", "FBT", "ASYNC240", "S311"]
"examples/**" = ["D", "S105", "PLR2004", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests", "examples"]
